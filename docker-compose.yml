services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /app/scripts/start-web.sh
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/1
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
      - backups_volume:/app/backend/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /app/scripts/start-celery.sh
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/1
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
      - backups_volume:/app/backend/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: /app/scripts/start-celery-beat.sh
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/1
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
      - backups_volume:/app/backend/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/backend/staticfiles:ro
      - media_volume:/app/backend/media:ro
    depends_on:
      - web

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  backups_volume: