<div class="fixed inset-0 z-50 grid place-items-center bg-slate-950/60 p-4" x-data="{ open: true }" x-show="open">
    <div class="workspace-card w-full max-w-2xl">
        <div class="mb-4 flex items-center justify-between">
            <h2 class="font-display text-xl font-bold">{{ modal_title }}</h2>
            <button type="button" class="btn-secondary px-3 py-2" x-on:click="open = false">Close</button>
        </div>
        {{ modal_body }}
    </div>
</div>
