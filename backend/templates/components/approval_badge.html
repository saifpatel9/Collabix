<span class="status-pill
{% if status == 'approved' %}border-emerald-400/20 bg-emerald-400/10 text-emerald-700 dark:text-emerald-300
{% elif status == 'rejected' %}border-red-400/20 bg-red-400/10 text-red-700 dark:text-red-300
{% elif status == 'pending' %}border-amber-400/20 bg-amber-400/10 text-amber-700 dark:text-amber-300
{% elif status == 'cancelled' %}border-slate-200 bg-slate-100 text-slate-500 dark:border-white/10 dark:bg-white/5 dark:text-slate-400
{% else %}border-brand-400/20 bg-brand-400/15 text-brand-700 dark:text-brand-200{% endif %}">
    {{ label|default:status|title }}
</span>
