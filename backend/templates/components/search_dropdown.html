<div class="absolute right-0 top-2 z-50 w-full overflow-hidden rounded-[20px] border border-slate-200 bg-white shadow-md dark:border-white/10 dark:bg-ink-800 dark:shadow-workspace">
    {% if query %}
        {% for result in results %}
            <a href="{{ result.url }}" class="block border-b border-slate-200 px-4 py-3 text-sm hover:bg-slate-50 dark:border-white/10 dark:hover:bg-white/[0.04]">
                <span class="text-xs font-bold uppercase tracking-[0.2em] text-brand-400">{{ result.type }}</span>
                <span class="mt-1 block font-semibold text-slate-800 dark:text-slate-200">{{ result.title }}</span>
                <span class="text-xs text-slate-500">{{ result.subtitle }}</span>
            </a>
        {% empty %}
            <div class="px-4 py-4 text-sm text-slate-500">No results found.</div>
        {% endfor %}
    {% else %}
        <div class="px-4 py-4 text-sm text-slate-500">Start typing to search.</div>
    {% endif %}
</div>
