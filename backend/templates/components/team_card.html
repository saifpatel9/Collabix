<article class="workspace-card p-5 transition hover:border-brand-400/25 hover:bg-slate-50 dark:hover:bg-ink-800">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brand-400">{{ team.department.name }}</p>
            <h2 class="font-display mt-2 text-lg font-bold text-slate-900 dark:text-slate-50">
                <a href="{% url 'projects:team_detail' team.pk %}">{{ team.name }}</a>
            </h2>
        </div>
        <span class="status-pill {% if team.is_active %}border-emerald-400/20 bg-emerald-400/10 text-emerald-300{% else %}border-slate-200 bg-slate-50 text-slate-500 dark:border-white/10 dark:bg-white/5 dark:text-slate-400{% endif %}">
            {% if team.is_active %}Active{% else %}Archived{% endif %}
        </span>
    </div>
    <p class="mt-3 line-clamp-2 text-sm text-slate-600 dark:text-slate-400">{{ team.description|default:"No description provided." }}</p>
    <div class="mt-5 text-sm">
        <p class="text-slate-500 dark:text-slate-400">Team Lead</p>
        <p class="font-semibold text-slate-800 dark:text-slate-100">{{ team.team_lead.user.full_name|default:"Unassigned" }}</p>
    </div>
</article>
