<article class="workspace-card p-4">
    <div class="flex items-start justify-between gap-3">
        <div>
            <h3 class="font-display font-semibold text-slate-900 dark:text-slate-50">{{ milestone.name }}</h3>
            <p class="mt-1 text-sm text-slate-500">{{ milestone.project.code }}{% if milestone.project.name %} - {{ milestone.project.name }}{% endif %}</p>
        </div>
        <span class="status-pill
            {% if milestone.status == 'completed' %}border-emerald-400/20 bg-emerald-400/10 text-emerald-700 dark:text-emerald-300
            {% elif milestone.status == 'delayed' %}border-red-400/20 bg-red-400/10 text-red-700 dark:text-red-300
            {% elif milestone.status == 'in_progress' %}border-brand-400/20 bg-brand-400/15 text-brand-700 dark:text-brand-200
            {% else %}border-slate-200 bg-slate-100 text-slate-500 dark:border-white/10 dark:bg-white/5 dark:text-slate-400{% endif %}">
            {{ milestone.get_status_display }}
        </span>
    </div>
    <p class="mt-3 text-sm text-slate-600 dark:text-slate-400">{{ milestone.description|default:"No description provided." }}</p>
    <p class="mt-4 text-sm font-semibold text-slate-800 dark:text-slate-200">Due {{ milestone.due_date }}</p>
</article>
