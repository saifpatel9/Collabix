<div id="notification-widget" class="relative" x-data="{ open: {% if force_open %}true{% else %}false{% endif %} }"{% if notification_widget_oob %} hx-swap-oob="true"{% endif %}>
    <button class="btn-secondary relative px-3 py-2" x-on:click="open = !open">
        Notifications
        <span id="notification-count" class="absolute -right-2 -top-2 {% if not unread_count %}hidden {% endif %}grid h-5 min-w-5 place-items-center rounded-full bg-brand-400 px-1 text-xs font-bold text-ink-950">{{ unread_count }}</span>
    </button>
    <div class="absolute right-0 top-12 z-50 w-80 overflow-hidden rounded-[20px] border border-slate-200 bg-white shadow-md dark:border-white/10 dark:bg-ink-800 dark:shadow-workspace" x-show="open" x-on:click.outside="open = false">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-white/10">
            <h3 class="font-display font-bold text-slate-800 dark:text-slate-100">Notifications</h3>
            <form method="post" action="{% url 'notifications:mark_all_read' %}" hx-post="{% url 'notifications:mark_all_read' %}" hx-target="#notification-widget" hx-swap="outerHTML">
                {% csrf_token %}
                <input type="hidden" name="response_scope" value="dropdown">
                <button class="text-xs font-semibold text-brand-600 dark:text-brand-300">Mark all read</button>
            </form>
        </div>
        <div id="notification-dropdown-list" class="max-h-96 overflow-y-auto">
            {% for notification in notifications %}
                <form method="post" action="{% url 'notifications:mark_read' notification.pk %}" hx-post="{% url 'notifications:mark_read' notification.pk %}" hx-target="#notification-widget" hx-swap="outerHTML">
                    {% csrf_token %}
                    <input type="hidden" name="response_scope" value="dropdown">
                    <button class="block w-full border-b border-slate-200 px-4 py-3 text-left hover:bg-slate-50 dark:border-white/10 dark:hover:bg-white/[0.04]">
                        <span class="text-sm {% if not notification.is_read %}font-bold text-brand-600 dark:text-brand-300{% else %}font-semibold text-slate-700 dark:text-slate-300{% endif %}">{{ notification.title }}</span>
                        <span class="mt-1 block text-xs text-slate-500 dark:text-slate-400">{{ notification.message }}</span>
                    </button>
                </form>
            {% empty %}
                <p class="px-4 py-5 text-sm text-slate-500 dark:text-slate-400">No notifications yet.</p>
            {% endfor %}
        </div>
        <a href="{% url 'notifications:center' %}" class="block border-t border-slate-200 px-4 py-3 text-center text-sm font-semibold text-brand-600 dark:border-white/10 dark:text-brand-300">View all notifications</a>
    </div>
</div>
