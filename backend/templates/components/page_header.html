<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
        {% if eyebrow %}<p class="text-xs font-semibold uppercase tracking-[0.3em] text-brand-400">{{ eyebrow }}</p>{% endif %}
        <h1 class="font-display mt-1 text-3xl font-extrabold text-slate-900 dark:text-slate-50">
        {% if subtitle %}<p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">{% endif %}
    </div>
    {% if action_url and action_label %}
        <a href="{{ action_url }}" class="btn-primary">
            {{ action_label }}
        </a>
    {% endif %}
</div>
