<div class="workspace-card">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-sm font-semibold text-slate-400">{{ label }}</p>
            <p class="font-display mt-3 text-4xl font-extrabold text-slate-900 dark:text-slate-50">{{ value }}</p>
        </div>
        {% if badge %}<span class="status-pill border-brand-400/20 bg-brand-400/15 text-brand-200">{{ badge }}</span>{% endif %}
    </div>
    {% if caption %}<p class="mt-3 text-xs font-medium text-slate-500 dark:text-slate-400">{{ caption }}</p>{% endif %}
</div>
