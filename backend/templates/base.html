{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full"
      x-data="{
          sidebarOpen: false,
          darkMode: localStorage.getItem('collabix-theme') === 'dark',

          toggleTheme() {
              this.darkMode = !this.darkMode;

              if (this.darkMode) {
                  document.documentElement.classList.add('dark');
                  localStorage.setItem('collabix-theme', 'dark');
              } else {
                  document.documentElement.classList.remove('dark');
                  localStorage.setItem('collabix-theme', 'light');
              }
          }
      }"
      x-init="
          if (darkMode) {
              document.documentElement.classList.add('dark')
          } else {
              document.documentElement.classList.remove('dark')
          }
      "><head>
    <script>
        (function() {
            const theme = localStorage.getItem('collabix-theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ APP_NAME }}{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dist/css/app.css' %}">
    {% block extra_css %}{% endblock extra_css %}
</head>
<body class="h-full overflow-hidden">
    {% if messages %}
        <div class="fixed right-4 top-4 z-50 space-y-3">
            {% for message in messages %}
                <div class="rounded-[14px] border border-brand-400/20 bg-white/95 px-4 py-3 text-sm font-medium text-slate-800 shadow-md backdrop-blur dark:bg-ink-800/95 dark:text-slate-100 dark:shadow-workspace">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block body %}{% endblock body %}
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="{% static 'dist/js/app.js' %}"></script>
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
