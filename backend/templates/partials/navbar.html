<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/80 backdrop-blur-xl dark:border-white/10 dark:bg-ink-900">
    <div class="flex items-center justify-between px-4 py-4 sm:px-6 lg:px-8 text-slate-800 dark:text-slate-100">
        <div class="flex flex-1 items-center gap-3">
            <button class="btn-secondary px-3 py-2 lg:hidden" x-on:click="sidebarOpen = true">
                Menu
            </button>
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.3em] text-brand-500 dark:text-brand-400">
                    Internal workflow management
                </p>
                <h2 class="font-display text-xl font-bold text-slate-900 dark:text-slate-100">
                    Operations Dashboard
                </h2>
            </div>
        </div>

        <div class="flex items-center gap-3 text-slate-700 dark:text-slate-200">
            {% if request.user.is_authenticated %}
                <div hx-get="{% url 'notifications:dropdown' %}" hx-trigger="load, every 30s" hx-swap="innerHTML"></div>
            {% endif %}
            {% if request.user.is_authenticated %}
                <span class="hidden text-sm font-semibold text-slate-500 dark:text-slate-300 sm:inline">{{ request.user.full_name }}</span>
            {% endif %}
            <button class="btn-secondary px-3 py-2" x-on:click="toggleTheme()" :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
                <span x-show="darkMode">☀ Light</span>
                <span x-show="!darkMode">☾ Dark</span>
            </button>
            {% if request.user.is_authenticated %}
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="btn-primary px-3 py-2">
                        Logout
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</header>
