{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collabix | Password Changed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#e8b84b', 50: '#fdf5e6', 100: '#f9e5b8', 200: '#f4d48a', 300: '#eec45c', 400: '#e8b84b', 500: '#d4a032', 600: '#b8882a', 700: '#9c7022', 800: '#80581a', 900: '#644012' }, ink: { DEFAULT: '#0f172a', 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' } },
          fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Syne', 'sans-serif'] },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Syne', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #e8b84b, #d4a032); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-primary { background: linear-gradient(135deg, #e8b84b, #d4a032); color: #0f172a; font-weight: 600; transition: all 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(232, 184, 75, 0.35); }
  </style>
</head>
<body class="bg-ink-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md text-center animate-in">
    <div class="mb-8">
      <div class="mx-auto w-24 h-24 rounded-full bg-brand/20 flex items-center justify-center mb-6">
        <svg class="w-12 h-12 text-brand" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-display font-bold mb-4">Password Changed</h1>
      <p class="text-ink-400 mb-8">Your password has been successfully updated. You can now access your dashboard.</p>
      <a href="{% url 'dashboard:home' %}" class="btn-primary inline-block px-8 py-3 rounded-xl">Go to Dashboard</a>
    </div>
  </div>
</body>
</html>
