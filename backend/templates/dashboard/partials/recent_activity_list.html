<div class="activity-feed">
    {% for activity in activities %}
    <div class="feed-item">
        <div class="feed-dot"></div>
        <div class="feed-content">
            <p class="feed-text">
                <span class="font-semibold">{{ activity.actor.full_name|default:"System" }}</span>
                {{ activity.verb }}
            </p>
            <p class="feed-time">{{ activity.timestamp|timesince }} ago</p>
        </div>
    </div>
    {% empty %}
    <div class="flex flex-col items-center justify-center py-10 text-center">
        <svg class="mb-3 h-10 w-10 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">No recent activity</p>
        <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">Activity will appear here as team members take actions.</p>
    </div>
    {% endfor %}
</div>
