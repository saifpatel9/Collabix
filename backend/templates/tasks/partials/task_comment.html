<article class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950">
    <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-bold">{{ comment.author.user.full_name }}</p>
        <time class="text-xs text-slate-500">{{ comment.created_at }}</time>
    </div>
    <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{ comment.comment|linebreaksbr }}</p>
</article>
