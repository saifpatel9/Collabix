<article id="task-{{ task.pk }}" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-start justify-between gap-3">
        <div>
            <a href="{% url 'tasks:task_detail' task.pk %}" class="text-sm font-extrabold text-accent-600 dark:text-accent-300">{{ task.task_code }}</a>
            <h3 class="mt-1 text-sm font-bold">{{ task.title }}</h3>
        </div>
        {% include "tasks/partials/priority_badge.html" %}
    </div>
    <p class="mt-3 text-xs text-slate-500">{{ task.project.code }}{% if task.due_date %} · due {{ task.due_date }}{% endif %}</p>
    <form method="post" action="{% url 'tasks:task_status_update' task.pk %}" hx-post="{% url 'tasks:task_status_update' task.pk %}" hx-target="#task-{{ task.pk }}" class="mt-3">
        {% csrf_token %}
        <select name="status" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs dark:border-slate-700 dark:bg-slate-900" onchange="this.form.requestSubmit()">
            {% for value, label in task.Status.choices %}<option value="{{ value }}" {% if task.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
    </form>
</article>
