<span class="status-pill mt-2
{% if task.status == 'completed' %}border-emerald-400/20 bg-emerald-400/10 text-emerald-300
{% elif task.status == 'blocked' %}border-rose-400/20 bg-rose-400/10 text-rose-300
{% elif task.status == 'in_progress' %}border-blue-400/20 bg-blue-400/10 text-blue-300
{% elif task.status == 'review' %}border-violet-400/20 bg-violet-400/10 text-violet-300
{% else %}border-white/10 bg-white/5 text-slate-400{% endif %}">
    {{ task.get_status_display }}
</span>
