<div class="workspace-card">
    <h2 class="text-lg font-extrabold">Activity</h2>
    <div class="mt-4 space-y-3">
        {% for activity in activities %}
            <div class="rounded-2xl bg-slate-50 p-3 text-sm dark:bg-slate-950">
                <p class="font-semibold">{{ activity.message|title }}</p>
                <p class="text-xs text-slate-500">{{ activity.actor.user.full_name|default:"System" }} · {{ activity.created_at }}</p>
            </div>
        {% empty %}
            <p class="text-sm text-slate-500 dark:text-slate-400">No task activity yet.</p>
        {% endfor %}
    </div>
</div>
